services:
  # ─── Node.js API ──────────────────────────────────────────────────────────
  - type: web
    name: futrix-node-api
    runtime: node
    rootDir: node-api
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false          # Set in Render dashboard (e.g. https://your-project.supabase.co)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # Set in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false          # Set in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        generateValue: true
      # IMPORTANT: PYTHON_URL must be a full https:// URL.
      # After first deploy, copy the Python AI service URL from Render dashboard
      # and set it here manually, e.g. https://futrix-python-ai.onrender.com
      - key: PYTHON_URL
        sync: false          # Set to full https:// URL of futrix-python-ai service in Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set to your Netlify URL in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false          # Set in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false          # Set in Render dashboard

  # ─── Python AI Engine ─────────────────────────────────────────────────────
  - type: web
    name: futrix-python-ai
    runtime: python
    rootDir: python-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      # CRITICAL: Must match INTERNAL_API_SECRET in futrix-node-api.
      # Copy the generated value from the node-api service and paste it here.
      - key: INTERNAL_API_SECRET
        sync: false          # Set to same value as futrix-node-api INTERNAL_API_SECRET
      # Add your node-api host and frontend URL here (comma-separated)
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://futrix-node-api.onrender.com,https://futrixai.netlify.app
